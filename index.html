<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202c28">
<title>拾页 SHIYE</title>
<style>
:root{--bg:#f3f5f2;--paper:#fff;--ink:#202522;--muted:#7b827d;--line:#d9ddd8;--deep:#202c28;--seal:#8c4b40;--soft:#e1e8e3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:82px}
main{padding:20px}.kicker{font-size:9px;letter-spacing:2px;color:var(--seal);margin:6px 0 8px}.title{font-size:28px;margin-bottom:18px}.en{font-size:10px;color:var(--muted)}
.stats,.card,.book,.note,.setting{background:var(--paper);border:1px solid var(--line);border-radius:15px}
.stats{display:flex;justify-content:space-between;padding:14px;margin-bottom:12px;font-size:13px}
.hero{background:var(--deep);border-radius:20px;padding:18px;color:#f0f2ee}.hero h2{font-size:21px;margin:7px 0}.hero p{font-size:11px;color:#aeb8b2;line-height:1.6}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.action{background:transparent;color:#f4f2ea;border:1px solid #61716b;border-radius:9px;padding:10px;font-size:11px}
.review{padding:14px;margin-top:12px;border:1px solid var(--seal);border-radius:15px;background:var(--paper)}
.add{display:flex;gap:8px;margin-bottom:12px}.input,.textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:11px;color:var(--ink);padding:12px;outline:none}.add .input{flex:1}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:11px;padding:10px 16px}.primary{background:var(--deep);color:#fff;border-color:var(--deep)}
.book{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:9px}.cover{width:45px;height:62px;border-radius:4px;background:#33423b;color:#fff;display:grid;place-items:center;font-size:9px}.book-title{flex:1;font-size:13px}
.note{padding:13px;margin-bottom:9px}.note-text{font-size:13px;line-height:1.7}.textarea{height:190px;resize:vertical;line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 15px}.tag{padding:7px 10px;border:1px solid var(--line);background:var(--paper);border-radius:99px;font-size:12px}.tag.on{border-color:var(--seal);background:var(--soft)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{background:var(--paper);border:1px solid var(--line);border-radius:9px;text-align:center;padding:10px 0;font-size:12px}.day.on{background:var(--soft);border-color:var(--seal);color:var(--seal)}
.nav{position:fixed;bottom:0;left:0;right:0;height:72px;background:var(--paper);border-top:1px solid var(--line);display:flex;z-index:20}.nav button{flex:1;border:0;background:none;color:var(--muted)}.nav .active{color:var(--seal)}.nav b{display:block;font-size:17px}.nav small{font-size:7px;letter-spacing:1px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sync{font-size:10px;color:var(--muted)}.sync.ok{color:#3b8d63}.empty{text-align:center;padding:28px;color:var(--muted);font-size:12px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:30}.modal.show{display:flex}.sheet{width:100%;max-width:720px;margin:auto;background:var(--paper);border-radius:20px 20px 0 0;padding:20px}.close{float:right;border:0;background:none;font-size:24px}
.auth{min-height:100vh;display:grid;place-items:center;padding:22px}.authbox{width:100%;max-width:430px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px}.authbox h1{margin:0 0 4px;font-size:27px}.authbox p{color:var(--muted);font-size:12px;line-height:1.7}.status{padding:12px;border-radius:10px;background:var(--soft);font-size:11px;margin-top:12px}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal" class="modal"></div>
<input id="camera" type="file" accept="image/*" capture="environment" style="display:none">

<script>
const SUPABASE_URL="https://aghgubiuttnhwsgdgxwq.supabase.co";
const SUPABASE_KEY="sb_publishable_RXqbZAZPOyPkMbP0LE44Lw_IN91DcoZ";
const LOCAL_KEY="shiye_web_v4";
let sb=null,session=null,cloudReady=false;

let state=JSON.parse(localStorage.getItem(LOCAL_KEY)||"null")||{
  tab:0,theme:"light",streak:12,books:[],pages:[],notes:[]
};

function saveLocal(){localStorage.setItem(LOCAL_KEY,JSON.stringify(state))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function today(){return new Date().toISOString().slice(0,10)}
function addDays(x,n){let d=new Date(x);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function fmt(x){return x?x.replaceAll("-","."):""}
function shell(k,t,e){return `<div class="kicker">${k}</div><div class="title">${t} <span class="en">${e}</span></div>`}
function setStatus(t,ok=false){let x=document.getElementById("sync");if(x){x.textContent=t;x.className="sync"+(ok?" ok":"")}}

function render(){
  let h=state.tab===0?read():state.tab===1?library():state.tab===2?thought():me();
  document.getElementById("root").innerHTML=`<div class="app"><main>
  <div class="top"><span id="sync" class="sync">${cloudReady?(session?"已连接云端":"可同步登录"):"本机可用"}</span>
  <button class="btn" id="loginBtn">${session?"退出":"同步登录"}</button></div>${h}</main>
  <nav class="nav">
  <button data-tab="0"><b>阅</b><small>READ</small></button>
  <button data-tab="1"><b>书</b><small>LIBRARY</small></button>
  <button data-tab="2"><b>思</b><small>THOUGHT</small></button>
  <button data-tab="3"><b>我</b><small>ME</small></button>
  </nav></div>`;

  document.querySelectorAll("[data-tab]").forEach(x=>x.onclick=()=>{
    state.tab=+x.dataset.tab;save();sync();render();
  });
  document.querySelectorAll("[data-act]").forEach(x=>x.onclick=()=>act(x.dataset.act,x.dataset.id));
  document.querySelectorAll("[data-tag]").forEach(x=>x.onclick=()=>{
    document.querySelectorAll("[data-tag]").forEach(y=>y.classList.remove("on"));
    x.classList.add("on");
  });
  document.querySelectorAll(".nav button").forEach((x,i)=>x.classList.toggle("active",i===state.tab));
  document.getElementById("loginBtn").onclick=()=>session?logout():login();
}

function read(){
  let last=state.pages[0];
  return shell("TODAY · "+fmt(today()),"阅","READ")+
  `<div class="stats"><span>连续阅读 ${state.streak} 天</span><span>留下 ${state.pages.length} 页</span></div>
  <section class="hero"><div class="kicker">TODAY · 今天</div><h2>今天读到什么？</h2>
  <p>不用写很多，留下一个值得回看的瞬间就够了。</p>
  <div class="actions"><button class="action" data-act="photo">▧ 截一页</button>
  <button class="action" data-act="thought">✎ 写感想</button><button class="action" data-act="book">＋ 记一本</button></div></section>
  ${last?`<div class="card" style="margin-top:12px;padding:10px"><img src="${last.uri}" style="width:100%;max-height:360px;object-fit:cover;border-radius:10px">
  <div class="top" style="margin:8px 0 0"><span class="muted">最近留下 · ${fmt(last.date)}</span>
  <button class="btn" data-act="remove-page">清除</button></div></div>`:""}
  <div class="kicker" style="margin-top:24px">READING CALENDAR</div>
  <div class="calendar">${Array.from({length:30},(_,i)=>`<div class="day ${i<state.streak?"on":""}">${i+1}</div>`).join("")}</div>`;
}

function library(){
  return shell("MY READING","书","LIBRARY")+
  `<div class="add"><input class="input" id="bookInput" placeholder="输入一本书">
  <button class="btn primary" data-act="add-book">添加</button></div>
  ${state.books.length?state.books.map(b=>`<div class="book" data-act="open-book" data-id="${b.id}">
  <div class="cover">拾页</div><div class="book-title">${esc(b.title)}
  <div class="muted">${b.finished?"已读完":"阅读中 · "+b.progress+"%"}</div></div><span>›</span></div>`).join("")
  :'<div class="empty">还没有书。先记下一本。</div>'}`;
}

function thought(){
  let due=state.notes.filter(n=>n.review<=today()&&!n.done);
  return shell("THOUGHT","思","THOUGHT")+
  (due.length?`<div class="review"><b>今天有 ${due.length} 条笔记值得回看</b>
  ${due.map(n=>`<p class="note-text">${esc(n.text)}<br><span class="muted">${esc(n.tag)} · ${fmt(n.date)}</span>
  <button class="btn" data-act="review" data-id="${n.id}">已回看</button></p>`).join("")}</div>`:"")+
  `<textarea id="noteText" class="textarea" placeholder="这一页为什么值得留下？"></textarea>
  <div class="kicker">小戳 · TAG</div><div class="tags">
  ${["值得实践","醍醐灌顶","反常识","待验证"].map(t=>`<button class="tag" data-tag="${t}">${t}</button>`).join("")}</div>
  <button class="btn primary" style="width:100%" data-act="save-note">保存，并在 30 天后回来</button>
  <div class="kicker" style="margin-top:24px">RECENT NOTES</div>
  ${state.notes.slice(0,8).map(n=>`<div class="note"><div class="note-text">${esc(n.text)}</div>
  <div class="muted">${esc(n.tag)} · ${fmt(n.date)} · 下次回看 ${fmt(n.review)}</div></div>`).join("")}`;
}

function me(){
  return shell("YOUR GROWTH","我","PROFILE")+
  `<div class="card" style="padding:16px"><b>${state.streak>=20?"执卷人 · Scholar":state.streak>=7?"七日初读者 · Reader":"初入书院 · Novice"}</b>
  <div class="muted" style="margin-top:6px">连续阅读 ${state.streak} 天</div></div>
  <div class="stats" style="margin-top:12px"><span>藏书 ${state.books.length}</span>
  <span>书页 ${state.pages.length}</span><span>笔记 ${state.notes.length}</span></div>
  <div class="status">${session?"当前已登录，数据会自动同步到云端。":"现在可以直接使用。点击右上角“同步登录”即可让电脑和手机共用云端数据。"}</div>`;
}

function act(a,id){
  if(a==="thought"){state.tab=2;save();sync();render()}
  else if(a==="book"){state.tab=1;save();sync();render()}
  else if(a==="photo")document.getElementById("camera").click()
  else if(a==="remove-page"){state.pages.shift();save();sync();render()}
  else if(a==="add-book"){
    let x=document.getElementById("bookInput"),t=x.value.trim();
    if(t){state.books.unshift({id:Date.now()+"",title:t,progress:0,finished:false});save();sync();render()}
  }
  else if(a==="save-note"){
    let t=document.getElementById("noteText").value.trim();
    if(!t)return alert("先写下一句话。");
    let tag=document.querySelector("[data-tag].on")?.dataset.tag||"随手记";
    state.notes.unshift({id:Date.now()+"",text:t,tag,date:today(),review:addDays(today(),30),done:false});
    save();sync();render();alert("已保存。30 天后回来回看。");
  }
  else if(a==="review"){
    let n=state.notes.find(x=>x.id===id);
    if(n){n.done=true;n.review=addDays(today(),30);save();sync();render()}
  }
  else if(a==="open-book")openBook(id);
}

function openBook(id){
  let b=state.books.find(x=>x.id===id),m=document.getElementById("modal");
  if(!b)return;
  m.innerHTML=`<div class="sheet"><button class="close" id="close">×</button>
  <div class="kicker">BOOK DETAIL</div><h2>${esc(b.title)}</h2>
  <p class="muted">${b.finished?"已读完":"阅读中"} · ${b.progress}%</p>
  <div class="actions"><button class="btn" data-p="10">+10%</button>
  <button class="btn" data-p="25">+25%</button><button class="btn" data-p="100">读完</button></div>
  <button class="btn" style="margin-top:15px" id="del">删除</button></div>`;
  m.classList.add("show");
  m.querySelector("#close").onclick=()=>m.classList.remove("show");
  m.querySelector("#del").onclick=()=>{
    state.books=state.books.filter(x=>x.id!==id);save();sync();m.classList.remove("show");render();
  };
  m.querySelectorAll("[data-p]").forEach(x=>x.onclick=()=>{
    b.progress=Math.min(100,b.progress+(+x.dataset.p));
    if(b.progress>=100)b.finished=true;
    save();sync();m.classList.remove("show");render();
  });
}

document.getElementById("camera").onchange=e=>{
  let f=e.target.files?.[0];if(!f)return;
  let r=new FileReader();
  r.onload=()=>{state.pages.unshift({id:Date.now()+"",uri:r.result,date:today()});save();sync();render();e.target.value=""};
  r.readAsDataURL(f);
};

async function loadSupabase(){
  try{
    if(!window.supabase)return;
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    cloudReady=true;
    let r=await sb.auth.getSession();
    session=r.data.session;
    sb.auth.onAuthStateChange((_event,s)=>{
      session=s;render();
      if(s)pull();
    });
    render();
    if(session)await pull();
  }catch(e){console.warn(e);cloudReady=false;render()}
}

async function pull(){
  if(!session||!sb)return;
  setStatus("正在同步…");
  try{
    let r=await sb.from("shiye_data").select("data").eq("id",session.user.id).maybeSingle();
    if(r.error)throw r.error;
    if(r.data?.data&&typeof r.data.data==="object"){
      state={...state,...r.data.data};
      saveLocal();
    }
    await push();
    setStatus("已同步",true);
    render();
  }catch(e){console.warn(e);setStatus("云端连接失败");render()}
}

async function push(){
  if(!session||!sb)return;
  let r=await sb.from("shiye_data").upsert({
    id:session.user.id,
    data:state,
    updated_at:new Date().toISOString()
  },{onConflict:"id"});
  if(r.error)console.warn(r.error);
}

function save(){saveLocal()}
function sync(){saveLocal();if(session)push()}

async function login(){
  if(!sb)return alert("云同步组件还没加载成功，请刷新页面后再试。");
  let email=prompt("输入你的邮箱，用于电脑和手机同步：");
  if(!email)return;
  let r=await sb.auth.signInWithOtp({
    email:email.trim(),
    options:{emailRedirectTo:location.href.split("#")[0]}
  });
  if(r.error)alert(r.error.message);
  else alert("登录链接已发到邮箱。请打开邮件里的链接完成登录。");
}

async function logout(){
  if(sb)await sb.auth.signOut();
  session=null;render();
}

function loadScript(src){
  return new Promise((resolve,reject)=>{
    let s=document.createElement("script");
    s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
  });
}

async function start(){
  render();
  try{
    await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2");
  }catch(e){
    try{await loadScript("https://unpkg.com/@supabase/supabase-js@2")}catch(e2){console.warn("Supabase SDK unavailable")}
  }
  if(window.supabase)await loadSupabase();
}

start();
</script>
</body>
</html>
